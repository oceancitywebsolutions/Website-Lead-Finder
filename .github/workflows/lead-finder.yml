name: Run Lead Finder

on:
  workflow_dispatch:
    inputs:
      towns:
        description: "Space-separated town list (leave blank for the full list in config.py)"
        required: false
        default: ""
      categories:
        description: "Space-separated category list (leave blank for the full list in config.py)"
        required: false
        default: ""
      limit:
        description: "Stop after this many leads (leave blank for no limit)"
        required: false
        default: ""
      verify:
        description: "Also verify leads with a web search? (needs the BRAVE_API_KEY secret)"
        required: false
        default: true
        type: boolean
      publish:
        description: "Also publish leads to a new Google Sheet tab? (needs the GOOGLE_SERVICE_ACCOUNT_JSON and GOOGLE_SHEET_ID secrets)"
        required: false
        default: true
        type: boolean

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run lead finder
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          INPUT_TOWNS: ${{ github.event.inputs.towns }}
          INPUT_CATEGORIES: ${{ github.event.inputs.categories }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS=()
          if [ -n "$INPUT_TOWNS" ]; then ARGS+=(--towns $INPUT_TOWNS); fi
          if [ -n "$INPUT_CATEGORIES" ]; then ARGS+=(--categories $INPUT_CATEGORIES); fi
          if [ -n "$INPUT_LIMIT" ]; then ARGS+=(--limit "$INPUT_LIMIT"); fi
          python lead_finder.py "${ARGS[@]}"

      - name: Verify leads (optional)
        if: ${{ github.event.inputs.verify != 'false' }}
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          if [ -z "$BRAVE_API_KEY" ]; then
            echo "BRAVE_API_KEY secret not set, skipping verification."
            exit 0
          fi
          python verify_leads.py

      - name: Publish to Google Sheet (optional)
        if: ${{ github.event.inputs.publish != 'false' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON or GOOGLE_SHEET_ID secret not set, skipping publish."
            exit 0
          fi
          python publish_to_sheets.py

      - name: Upload leads CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-devon-cornwall
          path: leads_devon_cornwall.csv
